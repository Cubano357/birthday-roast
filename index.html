<meta charset="UTF-8">
<title>Birthday Roast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #FFF7EA;
    --surface: #FFFDF9;
    --surface-2: #FFF1DA;
    --ink: #2C1B2E;
    --ink-soft: #7A647C;
    --coral: #FF5D5D;
    --coral-strong: #E23F4E;
    --marigold: #E8951F;
    --marigold-soft: #F6C976;
    --teal: #1FA898;
    --pink: #E84393;
    --border: #EEDCB8;
    --shadow: rgba(44, 27, 46, 0.16);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E0F23;
      --surface: #2A1731;
      --surface-2: #35203C;
      --ink: #F6ECE4;
      --ink-soft: #C4AEC7;
      --coral: #FF7A6E;
      --coral-strong: #FF9186;
      --marigold: #FFC35E;
      --marigold-soft: #7A5A22;
      --teal: #4FD9C4;
      --pink: #FF7AB6;
      --border: #4A2C53;
      --shadow: rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1E0F23;
    --surface: #2A1731;
    --surface-2: #35203C;
    --ink: #F6ECE4;
    --ink-soft: #C4AEC7;
    --coral: #FF7A6E;
    --coral-strong: #FF9186;
    --marigold: #FFC35E;
    --marigold-soft: #7A5A22;
    --teal: #4FD9C4;
    --pink: #FF7AB6;
    --border: #4A2C53;
    --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    padding: 48px 20px 64px;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 36px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout {
      grid-template-columns: 1fr;
    }
    main { max-width: 560px; }
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    padding-top: 6px;
  }

  .confetti {
    position: absolute;
    top: -2px;
    left: 0;
    right: 0;
    height: 40px;
    pointer-events: none;
    overflow: visible;
  }

  .confetti i {
    position: absolute;
    display: block;
    border-radius: 2px;
  }

  .confetti i:nth-child(1) { left: 2%;  top: 4px;  width: 8px;  height: 8px; background: var(--marigold); transform: rotate(18deg); border-radius: 50%; }
  .confetti i:nth-child(2) { left: 16%; top: 22px; width: 7px;  height: 12px; background: var(--pink); transform: rotate(-16deg); }
  .confetti i:nth-child(3) { left: 30%; top: 0;    width: 9px;  height: 9px; background: var(--teal); transform: rotate(8deg); border-radius: 50%; }
  .confetti i:nth-child(4) { left: 47%; top: 18px; width: 6px;  height: 10px; background: var(--coral); transform: rotate(24deg); }
  .confetti i:nth-child(5) { left: 63%; top: 2px;  width: 8px;  height: 8px; background: var(--teal); transform: rotate(-10deg); border-radius: 50%; }
  .confetti i:nth-child(6) { left: 79%; top: 20px; width: 7px;  height: 11px; background: var(--marigold); transform: rotate(-22deg); }
  .confetti i:nth-child(7) { left: 93%; top: 3px;  width: 7px;  height: 7px; background: var(--pink); transform: rotate(14deg); border-radius: 50%; }

  h1 {
    font-family: 'Bricolage Grotesque', 'Archivo', sans-serif;
    font-weight: 800;
    font-size: clamp(2.1rem, 6vw, 2.75rem);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
    color: var(--ink);
    position: relative;
  }

  h1 .word-birthday { color: var(--teal); }
  h1 .word-roast { color: var(--coral-strong); }
  h1 .bang { color: var(--marigold); }

  .eyebrow {
    align-self: flex-start;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #2C1010;
    background: var(--marigold);
    padding: 7px 16px;
    border-radius: 999px;
    transform: rotate(-2deg);
    box-shadow: 0 8px 16px -10px var(--shadow);
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.5;
    max-width: 46ch;
    margin: 0;
  }

  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 12px 28px -18px var(--shadow);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-row {
    display: flex;
    gap: 16px;
  }

  .field-row .field {
    flex: 1;
    min-width: 0;
  }

  label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  input {
    font-family: 'Archivo', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--border);
    padding: 6px 2px 8px;
    outline: none;
    transition: border-color 0.15s ease;
    min-width: 0;
    width: 100%;
  }

  input::placeholder {
    color: var(--ink-soft);
    opacity: 0.55;
  }

  input:focus {
    border-bottom-color: var(--marigold);
  }

  button {
    font-family: 'Archivo', sans-serif;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--coral);
    color: #2C1010;
    font-weight: 700;
    font-size: 1rem;
    padding: 13px 20px;
    border-radius: 999px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 10px 20px -10px var(--shadow);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .card-stack {
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .card-stage {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px 18px 18px 6px;
    padding: 34px 30px 28px 52px;
    position: relative;
    box-shadow: 0 26px 44px -22px var(--shadow), 0 2px 0 var(--border);
    display: flex;
    flex-direction: column;
    gap: 16px;
    transform: rotate(var(--rotate, 0.6deg)) scale(var(--scale, 1));
    transition: opacity 0.2s ease;
  }

  .card-stage.is-older {
    --scale: 0.97;
    opacity: 0.8;
    filter: saturate(0.88);
    box-shadow: 0 14px 26px -20px var(--shadow), 0 2px 0 var(--border);
  }

  .card-stage::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 26px;
    border-radius: 6px 0 0 6px;
    background: linear-gradient(to right, var(--shadow), transparent);
    opacity: 0.55;
  }

  .card-stage::after {
    content: "";
    position: absolute;
    top: 0;
    left: 26px;
    bottom: 0;
    width: 1px;
    background: var(--border);
  }

  .greeting {
    font-family: 'Bricolage Grotesque', 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--coral-strong);
    margin: 0;
  }

  .candles {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    height: 34px;
  }

  .candle {
    width: 5px;
    height: 22px;
    border-radius: 2px;
    position: relative;
    flex-shrink: 0;
  }

  .candle:nth-child(1) { background: var(--coral); height: 18px; }
  .candle:nth-child(2) { background: var(--teal); height: 26px; }
  .candle:nth-child(3) { background: var(--pink); height: 16px; }
  .candle:nth-child(4) { background: var(--marigold); height: 22px; }

  .candle::before {
    content: "";
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 11px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 30%, #FFE9A8, var(--marigold) 70%);
    animation: flicker 1.8s ease-in-out infinite;
  }

  .candle:nth-child(2)::before { animation-delay: 0.3s; }
  .candle:nth-child(3)::before { animation-delay: 0.6s; }
  .candle:nth-child(4)::before { animation-delay: 0.9s; }

  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(0.88, 1.05); opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    .candle::before { animation: none; }
  }

  .message-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .message {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: clamp(1.5rem, 4.6vw, 1.85rem);
    line-height: 1.35;
    color: var(--ink);
    margin: 0;
    text-wrap: balance;
    min-height: 3.6em;
  }

  .card-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-ghost {
    background: var(--surface-2);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    transition: border-color 0.15s ease;
  }

  .btn-ghost:hover {
    border-color: var(--marigold);
  }

  .btn-ghost.copied,
  .btn-ghost.active {
    color: var(--coral-strong);
    border-color: var(--coral-strong);
  }

  .jam-btn {
    align-self: flex-start;
    margin-top: 2px;
  }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }

  @media (max-width: 420px) {
    .field-row { flex-direction: column; gap: 18px; }
    .card-stage { padding: 26px 20px 22px; }
    form { padding: 20px; }
  }

  .balloons {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }

  .balloon {
    position: absolute;
    bottom: -160px;
    width: 42px;
    height: 54px;
    background: currentColor;
    border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
    opacity: 0.5;
    animation: float-up linear infinite;
  }

  .balloon::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 7px solid currentColor;
  }

  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 60px;
    background: var(--ink-soft);
    opacity: 0.4;
  }

  .balloon:nth-child(1) { left: 4%;  color: var(--coral);         width: 38px; height: 48px; --sway: 26px;  animation-duration: 16s; animation-delay: -2s; }
  .balloon:nth-child(2) { left: 16%; color: var(--teal);          width: 46px; height: 58px; --sway: -34px; animation-duration: 21s; animation-delay: -14s; }
  .balloon:nth-child(3) { left: 29%; color: var(--marigold);      width: 40px; height: 52px; --sway: 20px;  animation-duration: 18s; animation-delay: -7s; }
  .balloon:nth-child(4) { left: 42%; color: var(--pink);          width: 44px; height: 56px; --sway: -22px; animation-duration: 23s; animation-delay: -19s; }
  .balloon:nth-child(5) { left: 57%; color: var(--coral-strong);  width: 36px; height: 46px; --sway: 30px;  animation-duration: 17s; animation-delay: -9s; }
  .balloon:nth-child(6) { left: 70%; color: var(--teal);          width: 48px; height: 60px; --sway: -18px; animation-duration: 24s; animation-delay: -4s; }
  .balloon:nth-child(7) { left: 83%; color: var(--marigold-soft); width: 40px; height: 52px; --sway: 24px;  animation-duration: 19s; animation-delay: -16s; }
  .balloon:nth-child(8) { left: 93%; color: var(--pink);          width: 34px; height: 44px; --sway: -28px; animation-duration: 22s; animation-delay: -11s; }

  @keyframes float-up {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--sway, 24px), -60vh) rotate(6deg); }
    100% { transform: translate(0, -130vh) rotate(-6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .balloons { display: none; }
  }
</style>

<div class="balloons" aria-hidden="true">
  <i class="balloon"></i><i class="balloon"></i><i class="balloon"></i><i class="balloon"></i>
  <i class="balloon"></i><i class="balloon"></i><i class="balloon"></i><i class="balloon"></i>
</div>

<main>
  <header>
    <div class="confetti" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <span class="eyebrow">Handle with sarcasm</span>
    <h1><span class="word-birthday">Birthday</span> <span class="word-roast">Roast</span><span class="bang">!</span></h1>
    <p class="subtitle">Give us the who, the how-old, and the hobby. We'll write the line you read out loud at the table.</p>
    <button type="button" id="jam-btn" class="btn-ghost jam-btn">🎵 Play a jam</button>
  </header>

  <div class="layout">
    <div class="panel-form">
      <form id="roast-form">
        <div class="field">
          <label for="name">Their name</label>
          <input id="name" name="name" type="text" placeholder="Maya" value="Maya" autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="age">Turning</label>
            <input id="age" name="age" type="number" min="1" max="130" placeholder="32" value="32">
          </div>
          <div class="field">
            <label for="hobby">Known for</label>
            <input id="hobby" name="hobby" type="text" placeholder="competitive birdwatching" value="competitive birdwatching" autocomplete="off">
          </div>
        </div>
        <button type="submit" class="btn-primary">Generate the roast</button>
      </form>
    </div>

    <div class="panel-card">
      <div class="card-stack" id="card-stack"></div>
    </div>
  </div>

  <footer>No data saved anywhere — everything happens right here in your browser.</footer>
</main>

<script>
  const templates = [
    (n, a, h) => `Happy ${a}th, ${n}! At this rate your ${h} skills peaked years ago — but hey, at least you peaked at something.`,
    (n, a, h) => `${n}, ${a} years old and still telling people ${h} is "a whole personality." We love that for you. Truly. Sort of.`,
    (n, a, h) => `They say age is just a number, ${n}. ${a} is a pretty big number though. Almost as big as your ${h} collection.`,
    (n, a, h) => `Happy birthday ${n}! ${a} looks great on you — like a fine wine, or your ${h} gear, aged and slightly concerning.`,
    (n, a, h) => `Another year older, ${n}, and somehow still not better at ${h}. Impressive consistency.`,
    (n, a, h) => `${a}?! ${n}, I've seen milk cartons with a longer shelf life than your attention span for ${h}.`,
    (n, a, h) => `Happy ${a}th birthday to ${n} — the only person I know who can turn ${h} into a full-blown personality crisis.`,
    (n, a, h) => `${n}, at ${a} you've officially been doing ${h} long enough to call it "a journey." We're all very proud. And a little concerned.`,
    (n, a, h) => `Congrats on ${a} years, ${n}. Somewhere out there, your ${h} instructor is quietly updating their resume.`,
    (n, a, h) => `Here's to ${n}: ${a} years young, and still convinced ${h} is going to make them famous. Never stop dreaming.`,
    (n, a, h) => `Happy birthday, ${n}! ${a} candles on the cake — almost as many as the hours you've spent explaining ${h} to people who didn't ask.`,
    (n, a, h) => `${n} just turned ${a}, which in ${h} years is basically ancient. Respect your elders.`,
    (n, a, h) => `You're ${a} now, ${n}. Old enough to know better, young enough to still blame ${h} for everything.`,
    (n, a, h) => `Happy birthday ${n}! May your ${a}th year bring you everything you want — except maybe more time for ${h}. You've had enough.`,
    (n, a, h) => `${n}: ${a} trips around the sun, and yet somehow zero improvement in ${h}. That's dedication.`,
    (n, a, h) => `Legal notice: ${n} is now ${a}, which means ${h} is officially a midlife thing now, not a phase.`,
    (n, a, h) => `Happy ${a}th, ${n}. You don't look a day over the last time you brought up ${h}, which was five minutes ago.`,
    (n, a, h) => `${a} years old and ${n} still lights up talking about ${h}. Honestly kind of beautiful. Mostly just a lot.`,
    (n, a, h) => `To ${n} on your ${a}th: may your cake be sweet and your ${h} skills finally, finally improve. Miracles happen.`,
    (n, a, h) => `Happy birthday ${n}! ${a} is the age you're legally required to admit ${h} isn't "just a phase" anymore.`
  ];

  const form = document.getElementById('roast-form');
  const nameInput = document.getElementById('name');
  const ageInput = document.getElementById('age');
  const hobbyInput = document.getElementById('hobby');
  const stackEl = document.getElementById('card-stack');

  let bag = [];

  function refillBag() {
    bag = templates.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }

  function pickMessage() {
    const name = nameInput.value.trim() || 'you';
    const age = ageInput.value.trim() || '??';
    const hobby = hobbyInput.value.trim().toLowerCase() || 'whatever that thing is you do';

    if (bag.length === 0) refillBag();
    const idx = bag.pop();
    return templates[idx](name, age, hobby);
  }

  async function copyCardMessage(card, btn) {
    const text = card.querySelector('.message').textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const messageEl = card.querySelector('.message');
      const range = document.createRange();
      range.selectNode(messageEl);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
    }
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  }

  function demoteTopCard() {
    const top = stackEl.firstElementChild;
    if (!top) return;
    top.classList.remove('is-newest');
    top.classList.add('is-older');
    const candles = top.querySelector('.candles');
    if (candles) candles.remove();
    const tryBtn = top.querySelector('.try-again-btn');
    if (tryBtn) tryBtn.remove();
  }

  function addCard(message) {
    demoteTopCard();

    const rotate = (Math.random() * 2.4 - 1.2).toFixed(2) + 'deg';
    const card = document.createElement('section');
    card.className = 'card-stage is-newest';
    card.style.setProperty('--rotate', rotate);
    card.innerHTML = `
      <div class="candles" aria-hidden="true">
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
        <div class="candle"></div>
      </div>
      <p class="greeting">Happy Birthday!</p>
      <div>
        <div class="message-label">Ready to copy into the card</div>
        <p class="message"></p>
      </div>
      <div class="card-actions">
        <button type="button" class="btn-ghost try-again-btn">Try another</button>
        <button type="button" class="btn-ghost copy-btn">Copy message</button>
      </div>
    `;
    card.querySelector('.message').textContent = message;
    card.querySelector('.try-again-btn').addEventListener('click', () => addCard(pickMessage()));
    const copyBtn = card.querySelector('.copy-btn');
    copyBtn.addEventListener('click', () => copyCardMessage(card, copyBtn));

    stackEl.prepend(card);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    refillBag();
    addCard(pickMessage());
  });

  refillBag();
  addCard(pickMessage());

  // --- Birthday jam: a short original upbeat loop, synthesized live (no audio files, no copyright song) ---
  const NOTE_FREQ = {
    C3: 130.81, G3: 196.00,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
  };
  const STEP_DUR = 0.19;
  const BAR_DUR = STEP_DUR * 16;
  const MELODY = ['E5', 'G5', 'E5', 'C5', 'D5', 'F5', 'D5', null, 'G5', 'E5', 'G5', 'A5', 'G5', 'E5', 'C5', null];
  const BASS_STEPS = [0, 4, 8, 12];

  const jamBtn = document.getElementById('jam-btn');
  let audioCtx = null;
  let noiseBuffer = null;
  let jamTimer = null;
  let jamPlaying = false;

  function pluck(ctx, freq, time, duration, type, peak) {
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(peak, time + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(time);
    osc.stop(time + duration + 0.02);
  }

  function kick(ctx, time) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(45, time + 0.12);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.5, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);
    osc.connect(gain).connect(ctx.destination);
    osc.start(time);
    osc.stop(time + 0.16);
  }

  function hat(ctx, buffer, time) {
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 6000;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.12, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(time);
    src.stop(time + 0.06);
  }

  function createNoiseBuffer(ctx) {
    const size = ctx.sampleRate * 0.2;
    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function scheduleBar(ctx, startTime) {
    MELODY.forEach((note, i) => {
      if (note) pluck(ctx, NOTE_FREQ[note], startTime + i * STEP_DUR, STEP_DUR * 0.9, 'triangle', 0.16);
    });
    BASS_STEPS.forEach((step, idx) => {
      const note = idx % 2 === 0 ? 'C3' : 'G3';
      pluck(ctx, NOTE_FREQ[note], startTime + step * STEP_DUR, STEP_DUR * 3.6, 'sawtooth', 0.1);
      kick(ctx, startTime + step * STEP_DUR);
      hat(ctx, noiseBuffer, startTime + (step + 2) * STEP_DUR);
    });
  }

  function startJam() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    noiseBuffer = noiseBuffer || createNoiseBuffer(audioCtx);
    jamPlaying = true;
    let nextBarTime = audioCtx.currentTime + 0.05;
    (function queueBar() {
      scheduleBar(audioCtx, nextBarTime);
      nextBarTime += BAR_DUR;
      jamTimer = setTimeout(queueBar, BAR_DUR * 1000);
    })();
  }

  function stopJam() {
    jamPlaying = false;
    clearTimeout(jamTimer);
  }

  jamBtn.addEventListener('click', () => {
    if (jamPlaying) {
      stopJam();
      jamBtn.textContent = '🎵 Play a jam';
      jamBtn.classList.remove('active');
    } else {
      startJam();
      jamBtn.textContent = '⏹ Stop the jam';
      jamBtn.classList.add('active');
    }
  });
</script>
